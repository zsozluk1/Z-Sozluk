<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z Sözlük | Z Kuşağı Sözlüğü</title>
  <link rel="icon" type="image/png" href="logo-z-sozluk.png">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="ust-alan">
    <a class="logo" href="#" aria-label="Z Sözlük ana sayfa">Z<span>.</span></a>
    <span class="ust-yazi">DİJİTAL KÜLTÜR SÖZLÜĞÜ</span>
  </header>

  <main class="sayfa">
    <section class="tanitim">
      <p class="etiket">KELİMELERİN YENİ NESİL HALİ</p>
      <h1>Z <span>Sözlük</span></h1>
      <p class="aciklama">
        Z kuşağının kullandığı kelimeleri keşfet, Türkçe karşılıklarını öğren.
      </p>

      <label class="arama-kutusu" for="arama">
        <span aria-hidden="true">⌕</span>
        <input
          id="arama"
          type="search"
          placeholder="Bir kelime ara… Örn: cringe"
          autocomplete="off"
        >
        <kbd>/</kbd>
      </label>

      <p id="sonuc-bilgisi" class="sonuc-bilgisi" aria-live="polite"></p>
    </section>

    <section class="sozluk-bolumu" aria-label="Sözlük kelimeleri">
      <div class="bolum-basligi">
        <h2>Sözlük</h2>
        <span>Alfabetik keşfet</span>
      </div>

      <nav id="harfler" class="harfler" aria-label="Alfabetik harfler"></nav>
      <div id="kelime-listesi" class="kelime-listesi"></div>
    </section>

    <footer>
      <p>Z Sözlük — Gençlerin dili, Türkçenin karşılığı.</p>
    </footer>
  </main>
</body>
</html>
